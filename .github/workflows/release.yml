name: release

# Linux-only release build for this app. The shared `app-release` builds
# macOS and Windows too, which this app does not support, so this workflow
# builds the Linux assets on GitHub and publishes an existing draft release.
# release-plz starts it with the tag it created; run it by hand to rebuild
# the assets of a release that is still a draft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to build, such as v0.1.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "$TAG is published, so it is immutable and takes no assets; cut a new release" >&2
            exit 1
          fi
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

  build:
    name: build x86_64-linux
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
      PLATFORM: x86_64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install runtime libraries for the smoke run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxkbcommon0 libx11-6 libxcursor1 libxi6 libxrandr2 libwayland-client0
      - run: rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - run: xvfb-run -a timeout 90 "target/$TARGET/release/process-control" --smoke
      - run: sh scripts/package.sh "$TARGET" "$PLATFORM" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ env.PLATFORM }}
          path: dist/*
          if-no-files-found: error

  onelf:
    name: onelf x86_64-linux
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
    permissions:
      contents: read
    env:
      PINNED_ONELF_VERSION: 0.5.0
      PINNED_ONELF_SHA256: 72b7d55ae01dc7ec736c3dd072bc3781ea66833bf7a5ac4d9cea4a9abe60b597
      MESA_RELEASE: v26.2.5-1
      MESA_SHA256: 0a9c2b015c7c848f5d64d5fd871b4ee39acded90e210ec24626f95fffe53c50e
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: x86_64-linux
    steps:
      - name: Install build packages
        run: |
          retry() {
            attempt=0
            while ! "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "$* failed $attempt times" >&2
                return 1
              fi
              echo "$* failed, retrying ($attempt/3)" >&2
              sleep 10
            done
          }
          retry pacman -Syu --disable-sandbox --noconfirm --needed \
            base-devel git rustup patchelf wayland libxkbcommon libxkbcommon-x11 \
            libx11 libxcursor libxi libxrandr mesa jq xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install onelf-pkgs Mesa
        run: |
          tree="gl-${PLATFORM%-linux}.tar.zst"
          curl -fsSL -o "/tmp/$tree" \
            "https://github.com/onelf-pkgs/mesa/releases/download/$MESA_RELEASE/$tree"
          echo "$MESA_SHA256  /tmp/$tree" | sha256sum -c -
          mkdir /tmp/gl
          tar --zstd -xf "/tmp/$tree" -C /tmp/gl
          retry() {
            attempt=0
            while ! "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "$* failed $attempt times" >&2
                return 1
              fi
              echo "$* failed, retrying ($attempt/3)" >&2
              sleep 10
            done
          }
          retry pacman -Rdd --disable-sandbox --noconfirm mesa
          cp -an /tmp/gl/lib/. /usr/lib/
          cp -an /tmp/gl/share/. /usr/share/
          ldconfig
      - run: rustup default stable
      - run: cargo build --release --locked
      - name: Install onelf
        run: |
          curl -fsSL -o /usr/local/bin/onelf \
            "https://github.com/QaidVoid/onelf/releases/download/$PINNED_ONELF_VERSION/onelf-$PLATFORM"
          echo "$PINNED_ONELF_SHA256  /usr/local/bin/onelf" | sha256sum -c -
          chmod +x /usr/local/bin/onelf
          onelf --version
      - run: sh scripts/package-onelf.sh "$PLATFORM" "$VERSION"
      - name: Smoke run the bundle
        run: xvfb-run -a timeout 60 dist/*.onelf --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-onelf-${{ env.PLATFORM }}
          path: dist/*.onelf
          if-no-files-found: error

  appimage:
    name: appimage anylinux-x86_64
    needs: prepare
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest@sha256:782f92dd4cd2adee5544ec7fc53d06a9168489041fae13271b418123c858d5e7
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: anylinux-x86_64
      QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/64fb5d4487a9c524773b2dc611cdf6d018c767a4/useful-tools/quick-sharun.sh
      DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/64fb5d4487a9c524773b2dc611cdf6d018c767a4/useful-tools/get-debloated-pkgs.sh
      MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/64fb5d4487a9c524773b2dc611cdf6d018c767a4/useful-tools/make-aur-package.sh
    steps:
      - uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      - name: Install build packages
        run: |
          retry() {
            attempt=0
            while ! "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "$* failed $attempt times" >&2
                return 1
              fi
              echo "$* failed, retrying ($attempt/3)" >&2
              sleep 10
            done
          }
          retry pacman -S --noconfirm --needed rustup wayland libxkbcommon \
            libxkbcommon-x11 libx11 libxcursor libxi libxrandr xorg-xauth
          get-debloated-pkgs --add-common --prefer-nano
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - run: rustup default stable
      - run: cargo build --release --locked
      - run: sh scripts/package-appimage.sh "$PLATFORM" "$VERSION"
      - name: Smoke run the AppImage
        run: xvfb-run -a timeout 60 dist/*.AppImage --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-appimage-${{ env.PLATFORM }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, onelf, appimage]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
