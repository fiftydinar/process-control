[package]
name = "process-control"
version = "0.1.6"
edition = "2024"
description = "A fast, light task manager"
license = "MIT"
repository = "https://github.com/pkgforge-apps/process-control"
homepage = "https://pkgforge-apps.github.io/process-control/"
readme = "README.md"
publish = false
exclude = ["/docs", "/scripts", "/.github", "/.agents", "/.claude"]

# Read by the shared release workflow. `appimage = true` ships an Anylinux
# AppImage beside the onelf bundle; see the anylinux-appimage skill.
[package.metadata.pkgforge]
appimage = true

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
libc = "0.2.191"
png = "0.18.1"
resvg = { version = "0.49.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
x11rb = "0.14.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dev-dependencies]
egui_kittest = "0.37.0"
